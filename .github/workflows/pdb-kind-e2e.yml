name: PDB controller kind e2e

on:
  pull_request:
    paths:
      - "controller/src/pdb/**"
      - "controller/tests/e2e/**"
      - "controller/Cargo.toml"
      - ".github/workflows/pdb-kind-e2e.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pdb-kind-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: controller
      - name: Unit and in-memory integration tests
        working-directory: controller
        run: cargo test --lib pdb && cargo test --test pdb_reconciler
      - uses: helm/kind-action@v1
        with:
          install_only: true
      - name: Drain-blocking e2e on kind
        run: controller/tests/e2e/pdb-drain-blocked.sh
