name: Testnet Operator (controller)

# The controller/ crate is its own Cargo workspace, so it is not covered by
# the operator jobs in ci.yml. This gates the StellarTestnet operator
# (issue #246): unit tests, release binary build and CRD drift.
on:
  push:
    branches: [main]
    paths:
      - "controller/**"
      - "scripts/test-ephemeral-testnet.sh"
      - ".github/workflows/controller.yml"
  pull_request:
    paths:
      - "controller/**"
      - "scripts/test-ephemeral-testnet.sh"
      - ".github/workflows/controller.yml"

concurrency:
  group: controller-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  testnet-operator:
    name: StellarTestnet operator (fmt, test, build, CRD drift)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: controller
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: controller
          shared-key: "ci-controller"

      - name: Check formatting (testnet operator modules)
        run: |
          rustfmt --check --edition 2021 \
            src/crd/*.rs src/testnet/*.rs src/bin/stellar-testnet-operator.rs

      - name: Run tests
        run: cargo test --locked

      - name: Build operator binary
        run: cargo build --locked --release --bin stellar-testnet-operator

      - name: Check CRD manifest is up to date
        run: |
          set -euo pipefail
          ./target/release/stellar-testnet-operator crd > /tmp/crd.yaml
          diff <(sed -n '/^apiVersion/,$p' deploy/stellartestnets.yaml) /tmp/crd.yaml \
            || {
              echo "::error::deploy/stellartestnets.yaml is stale; regenerate it with" \
                "'cargo run --bin stellar-testnet-operator -- crd'"
              exit 1
            }

      - name: Shellcheck e2e script
        working-directory: .
        run: shellcheck -S error scripts/test-ephemeral-testnet.sh
