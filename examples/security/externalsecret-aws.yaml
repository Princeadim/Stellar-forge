# ESO SecretStore using AWS Secrets Manager and IRSA.
#
# Prerequisites:
#   1. Create the IAM role with the policy in docs/security/secrets-management.md
#   2. Replace the role ARN and region with your values.
#   3. Create the secret in AWS:
#      aws secretsmanager create-secret \
#        --name stellar/prod/validator-0 \
#        --secret-string '{"seed":"SXXX..."}'
#   4. Apply:  kubectl apply -f examples/security/externalsecret-aws.yaml
#
# StellarNode reference:
#   spec.validatorConfig.seedSecretRef: my-validator-seed

apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-secrets
  namespace: stellar
  labels:
    app.kubernetes.io/name: external-secrets
    app.kubernetes.io/component: secret-sync
  annotations:
    # Replace with your IRSA role ARN
    eks.amazonaws.com/role-arn: "arn:aws:iam::000000000000:role/stellar-seed-read"
    eks.amazonaws.com/sts-regional-endpoints: "true"

---
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: aws-secrets-manager
  namespace: stellar
  labels:
    app.kubernetes.io/name: stellar-operator
    app.kubernetes.io/component: secret-store
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1   # replace with your region
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets
            audiences:
              - sts.amazonaws.com

---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: validator-0-seed
  namespace: stellar
  labels:
    app.kubernetes.io/name: stellar-operator
    app.kubernetes.io/component: validator-seed
    stellar.org/node: validator-0
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: my-validator-seed    # value of spec.validatorConfig.seedSecretRef
    creationPolicy: Owner
    deletionPolicy: Retain     # keep Secret if ExternalSecret is deleted
    template:
      type: Opaque
      metadata:
        labels:
          stellar.org/secret-type: validator-seed
          stellar.org/node: validator-0
  data:
    - secretKey: seed          # key inside the resulting Kubernetes Secret
      remoteRef:
        key: stellar/prod/validator-0   # AWS Secrets Manager secret name
        property: seed                  # JSON key within the secret value
