# ESO SecretStore using HashiCorp Vault Kubernetes auth.
#
# Prerequisites:
#   1. Install Vault with Kubernetes auth enabled.
#   2. Write the Vault policy (see docs/security/secrets-management.md):
#      vault policy write stellar-validator stellar-validator.hcl
#   3. Create the Kubernetes auth role:
#      vault write auth/kubernetes/role/stellar-mainnet-validator \
#        bound_service_account_names=external-secrets \
#        bound_service_account_namespaces=stellar \
#        policies=stellar-validator \
#        ttl=1h
#   4. Write the seed (in a secure ceremony):
#      vault kv put secret/stellar/validators/validator-0 seed=SXXX...
#   5. Apply:  kubectl apply -f examples/security/externalsecret-vault.yaml
#
# StellarNode reference:
#   spec.validatorConfig.seedSecretRef: my-validator-seed

apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-secrets
  namespace: stellar
  labels:
    app.kubernetes.io/name: external-secrets
    app.kubernetes.io/component: secret-sync

---
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: vault-secrets
  namespace: stellar
  labels:
    app.kubernetes.io/name: stellar-operator
    app.kubernetes.io/component: secret-store
spec:
  provider:
    vault:
      server: "https://vault.vault.svc.cluster.local:8200"  # replace with your Vault URL
      path: "secret"
      version: "v2"
      # caBundle: ""  # base64-encoded CA cert for TLS verification
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "stellar-mainnet-validator"
          serviceAccountRef:
            name: external-secrets
          # audiences: ["vault"]   # uncomment if your cluster uses a non-default audience

---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: validator-0-seed
  namespace: stellar
  labels:
    app.kubernetes.io/name: stellar-operator
    app.kubernetes.io/component: validator-seed
    stellar.org/node: validator-0
spec:
  refreshInterval: 1h          # Vault policy TTL must be >= this value
  secretStoreRef:
    name: vault-secrets
    kind: SecretStore
  target:
    name: my-validator-seed    # value of spec.validatorConfig.seedSecretRef
    creationPolicy: Owner
    deletionPolicy: Retain     # keep Secret if ExternalSecret is deleted
    template:
      type: Opaque
      metadata:
        labels:
          stellar.org/secret-type: validator-seed
          stellar.org/node: validator-0
  data:
    - secretKey: seed          # key inside the resulting Kubernetes Secret
      remoteRef:
        key: stellar/validators/validator-0   # Vault KV path (without secret/data/ prefix)
        property: seed                        # field name within the KV secret
