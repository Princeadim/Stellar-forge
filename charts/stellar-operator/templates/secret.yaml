{{- if and .Values.secrets.create (not .Values.secrets.useExternalSecrets) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "stellar-operator.fullname" . }}-secrets
  labels:
    {{- include "stellar-operator.labels" . | nindent 4 }}
type: Opaque
{{- if .Values.secrets.items }}
data:
  {{- range $name, $config := .Values.secrets.items }}
  {{ $config.key }}: {{ $config.value | b64enc | quote }}
  {{- end }}
{{- end }}
{{- end }}
{{- if and .Values.secrets.create .Values.secrets.useExternalSecrets }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "stellar-operator.fullname" . }}-secrets
  labels:
    {{- include "stellar-operator.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.secrets.externalSecrets.refreshInterval | default "1h" }}
  secretStoreRef:
    name: {{ required "secrets.externalSecrets.secretStoreName is required when useExternalSecrets is true" .Values.secrets.externalSecrets.secretStoreName }}
    kind: {{ .Values.secrets.externalSecrets.secretStoreKind | default "SecretStore" }}
  target:
    name: {{ include "stellar-operator.fullname" . }}-secrets
    creationPolicy: Owner
  data:
    {{- range $name, $config := .Values.secrets.items }}
    - secretKey: {{ $config.key }}
      remoteRef:
        key: {{ $config.remoteRef.key | default $config.key }}
        {{- if $config.remoteRef.property }}
        property: {{ $config.remoteRef.property }}
        {{- end }}
    {{- end }}
{{- end }}