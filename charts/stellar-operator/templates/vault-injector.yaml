{{- if and .Values.webhook.enabled .Values.vaultInjector.enabled }}
# =============================================================================
# Vault Validator Seed Injector — issue #224
#
# Registers a MutatingAdmissionWebhook that intercepts Pod CREATE operations
# for Stellar Core pods annotated `stellar.io/vault-injection: "enabled"` and
# routes them to the stellar-webhook server's /mutate/vault endpoint.
#
# The webhook injects an init container that authenticates with HashiCorp
# Vault via the Kubernetes service-account auth method, fetches the validator
# seed, and renders the generated stellar-core.cfg into a memory-only tmpfs
# emptyDir volume.  The plaintext seed never reaches etcd: no Secret is
# created, no env var is defined, and the only destination is RAM-backed
# ephemeral storage destroyed with the pod.
#
# Prerequisites:
#   - .Values.webhook.enabled must be true (TLS-terminated webhook Service).
#   - Vault reachable from every onboarded namespace with the Kubernetes auth
#     method mounted and a role bound to the validator ServiceAccount
#     (see docs/security/vault-webhook-injection.md).
#   - cert-manager or manual caBundle injection configured for the webhook.
# =============================================================================
---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: stellar-vault-injector
  labels:
    app.kubernetes.io/name: stellar-webhook
    app.kubernetes.io/component: vault-seed-injector
    app.kubernetes.io/part-of: stellar-k8s
  {{- if .Values.webhook.certManager.enabled }}
  annotations:
    cert-manager.io/inject-ca-from: stellar-webhook/stellar-webhook-cert
  {{- end }}
webhooks:
  - name: vault-injector.stellar.io
    clientConfig:
      service:
        name: stellar-webhook
        namespace: stellar-webhook
        path: /mutate/vault
        port: 443
      {{- if not .Values.webhook.certManager.enabled }}
      # caBundle must be set manually when cert-manager is not used.
      # caBundle: <base64-encoded-ca-cert>
      {{- end }}
    rules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["pods"]
        scope: Namespaced
    admissionReviewVersions: ["v1", "v1beta1"]
    sideEffects: None
    # Must be ≤ 10 s (Kubernetes hard limit for admission webhooks).
    timeoutSeconds: {{ .Values.vaultInjector.webhookTimeoutSeconds | default 10 }}
    # IMPORTANT: Ignore failures — the injector is fail-open by design.
    # A degraded Vault or webhook must never prevent nodes from starting;
    # pods come up unmodified (validator config is then sourced from the
    # legacy path) so operators can remediate without downtime.
    failurePolicy: {{ .Values.vaultInjector.failurePolicy | default "Ignore" }}
    matchPolicy: Equivalent
    namespaceSelector:
      matchExpressions:
        # Skip system namespaces; never intercept our own infra.
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values:
            - kube-system
            - stellar-webhook
            {{- if .Values.vaultInjector.skipNamespaces }}
            {{- range .Values.vaultInjector.skipNamespaces }}
            - {{ . }}
            {{- end }}
            {{- end }}
    # Only fire for pods explicitly opted in through the annotation — plain
    # Horizon/RPC pods never pay the admission round trip.
    objectSelector:
      matchExpressions:
        - key: stellar.io/vault-injection
          operator: In
          values:
            - enabled
        - key: stellar.io/vault-injected
          operator: DoesNotExist
    reinvocationPolicy: Never
{{- end }}
