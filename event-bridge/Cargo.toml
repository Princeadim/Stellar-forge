[package]
name = "stellar-event-bridge"
version = "0.1.0"
edition = "2021"
authors = ["Stellar K8s Contributors"]
description = "Kafka Event Streaming Bridge for Horizon ledger events (issue #292)"
license = "Apache-2.0"
repository = "https://github.com/stellar/stellar-k8s"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
thiserror = "1"
anyhow = "1"

# Logging and tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Date/time handling
chrono = { version = "0.4", features = ["serde"] }

# HTTP client for the Horizon ingestion tap
reqwest = { version = "0.12", features = [
    "json",
    "rustls-tls-manual-roots",
], default-features = false }

# Kafka client (same version/features as the root crate)
rdkafka = { version = "0.36", optional = true, features = [
    "cmake-build",
    "ssl",
    "sasl",
] }

# CLI argument parsing
clap = { version = "4.5", features = ["derive", "env"] }

# Deterministic event IDs (SHA-256)
sha2 = "0.10"
hex = "0.4"

# Async trait objects for the sink/source abstractions
async-trait = "0.1"

[dev-dependencies]
wiremock = "=0.6.5"

[features]
default = ["kafka"]
# Kafka producer with exactly-once (transactional) delivery semantics
kafka = ["rdkafka"]

[[bin]]
name = "stellar-event-bridge"
path = "src/bin/stellar-event-bridge.rs"
required-features = ["kafka"]
