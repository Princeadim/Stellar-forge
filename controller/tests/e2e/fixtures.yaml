apiVersion: v1
kind: Namespace
metadata:
  name: stellar
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: stellarnodes.stellar.org
spec:
  group: stellar.org
  scope: Namespaced
  names: {kind: StellarNode, plural: stellarnodes, singular: stellarnode}
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-preserve-unknown-fields: true
---
apiVersion: stellar.org/v1alpha1
kind: StellarNode
metadata: {name: v1, namespace: stellar}
spec: {nodeType: Validator, network: Testnet}
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: v1, namespace: stellar}
spec:
  replicas: 1
  serviceName: v1
  selector:
    matchLabels: {app.kubernetes.io/instance: v1}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: stellar-node
        app.kubernetes.io/instance: v1
        stellar.org/node-type: Validator
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels: {stellar.org/node-type: Validator}
      containers:
        - name: pause
          image: registry.k8s.io/pause:3.9
---
