# The Stellar-K8s ephemeral testnet operator.
#
#   kubectl apply -f controller/deploy/operator.yaml
#
# Build and push the image first (see controller/README.md):
#   docker build -t <registry>/stellar-testnet-operator:latest controller
#
apiVersion: v1
kind: Namespace
metadata:
  name: stellar-testnet-system
  labels:
    app.kubernetes.io/name: stellar-testnet-operator
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stellar-testnet-operator
  namespace: stellar-testnet-system
  labels:
    app.kubernetes.io/name: stellar-testnet-operator
spec:
  replicas: 1
  # A single controller must not run twice: concurrent reconciles would
  # race on the CRD install and the finalizer patches.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: stellar-testnet-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: stellar-testnet-operator
    spec:
      serviceAccountName: stellar-testnet-operator
      containers:
        - name: controller
          # Replace with your registry; the controller prints its CRD with
          # `stellar-testnet-operator crd`.
          image: stellar-testnet-operator:latest
          imagePullPolicy: IfNotPresent
          args: []
          env:
            - name: RUST_LOG
              value: info
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            capabilities:
              drop: ["ALL"]
